x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/events_db
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_db"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    <<: *app
    ports:
      - "8000:8000"

  celery_worker:
    <<: *app
    command: celery -A tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/events_db
      REDIS_URL: redis://redis:6379/0
      DB_NULLPOOL: "1"

  celery_beat:
    <<: *app
    command: celery -A tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule

volumes:
  postgres_data:
